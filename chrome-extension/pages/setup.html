<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PA Hub - Setup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #1a202c;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #718096;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .section {
      margin-bottom: 32px;
    }

    .section h2 {
      font-size: 16px;
      color: #2d3748;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #4a5568;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    input[type="password"] {
      font-family: monospace;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .help-text {
      font-size: 12px;
      color: #a0aec0;
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
      margin-top: 12px;
    }

    .success-message {
      background: #c6f6d5;
      color: #22543d;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
      font-size: 14px;
    }

    .error-message {
      background: #fed7d7;
      color: #742a2a;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .status.connected {
      background: #c6f6d5;
      color: #22543d;
    }

    .status.not-connected {
      background: #fed7d7;
      color: #742a2a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 PA Hub Setup</h1>
    <p class="subtitle">Configure your Canvas credentials</p>

    <div class="section">
      <h2>📚 Canvas</h2>
      <div class="input-group">
        <label for="canvas-token">API Token</label>
        <input type="password" id="canvas-token" placeholder="Enter your Canvas API token">
        <div class="help-text">Get your token from <a href="https://canvas.andover.edu/profile/settings" target="_blank">Canvas Settings</a></div>
      </div>
    </div>

    <button id="save-btn" class="btn">Save & Start</button>

    <div id="success-message" class="success-message">
      ✓ Settings saved! PA Hub is now active.
    </div>

    <div id="error-message" class="error-message">
      Error saving settings. Please try again.
    </div>
  </div>

  <script src="../scripts/setup.js"></script>
</body>
</html>
